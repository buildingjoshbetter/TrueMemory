name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[all,dev]"
      - name: Run tests (gate — deterministic, no network)
        # Issue #426: a transient HuggingFace download flake must not block a
        # release of correct code. Network-marked tests run separately in CI.
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest tests/ -v -m "not network"
      - name: Lint
        run: ruff check truememory/ tests/

  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mcp-version: [minimum, latest]
        pydantic-version: [latest]
        include:
          - mcp-version: minimum
            pydantic-version: "2.11.0"
          - mcp-version: minimum
            pydantic-version: "2.14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Verify package metadata
        run: twine check --strict dist/*
      - name: Install wheel and verify MCP compatibility
        shell: python
        env:
          MCP_VERSION: ${{ matrix.mcp-version }}
          PYDANTIC_VERSION: ${{ matrix.pydantic-version }}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import venv

          wheel, = Path("dist").glob("*.whl")
          env_dir = Path(os.environ["RUNNER_TEMP"]) / "mcp-wheel-env"
          venv.EnvBuilder(with_pip=True).create(env_dir)
          python = env_dir / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          requirements = [str(wheel.resolve())]
          if os.environ["MCP_VERSION"] == "minimum":
              requirements.append("mcp[cli]==1.21.1")
          if os.environ["PYDANTIC_VERSION"] != "latest":
              requirements.append("pydantic==" + os.environ["PYDANTIC_VERSION"])
          subprocess.run([str(python), "-m", "pip", "install", *requirements], check=True)
          subprocess.run([str(python), "-m", "pip", "check"], check=True)
          subprocess.run([str(python), "-I", "tests/mcp-wheel-smoke.py"], check=True)

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches pyproject.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "ERROR: Git tag ($TAG) does not match pyproject.toml version ($VERSION)"
            exit 1
          fi
          echo "OK: tag=$TAG matches pyproject.toml version=$VERSION"

  publish:
    needs: [test, build-check, version-check]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
